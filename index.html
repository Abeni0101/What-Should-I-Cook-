<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 Intelligent Chef Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toast-container"></div>

    <!-- Inside index.html, update your <header> -->
<header>
    <div class="logo">
        <h1>Chef Engine 🍳</h1>
        <p>Your interactive, zero-waste kitchen assistant.</p>
    </div>
    <div class="header-actions" style="display: flex; gap: 10px;">
        <button id="lazy-mode-btn" class="glow-btn">👉 Lazy Mode</button>
        <button id="bailout-btn" class="glow-btn bailout">🍔 I Give Up (Eat Out)</button>
    </div>
</header>

    <main class="app-container">
        <aside class="controls glass-panel">
            <section class="input-group">
                <h3>1. My Pantry</h3>
                <form id="ingredient-form" class="flex-between" style="gap: 10px;">
                    <input type="text" id="ingredient-input" placeholder="Type & press Enter" autocomplete="off">
                    <button type="submit" id="add-ing-btn" class="action-btn small">+</button>
                </form>
                <p style="font-size: 0.8rem; color: #718096; margin-top: 5px;">Click 🚨 to mark items expiring soon!</p>
                <div id="active-ingredients" class="tag-container"></div>
            </section>

            <section class="pantry-group">
                <h3>Quick Add (Drag me!)</h3>
                <div class="pantry-items">
                    <div class="draggable-ingredient" draggable="true" data-item="chicken">🍗 Chicken</div>
                    <div class="draggable-ingredient" draggable="true" data-item="tomato">🍅 Tomato</div>
                    <div class="draggable-ingredient" draggable="true" data-item="onion">🧅 Onion</div>
                    <div class="draggable-ingredient" draggable="true" data-item="garlic">🧄 Garlic</div>
                </div>
            </section>

            <section class="pot-group">
                <div id="cooking-pot" class="drop-zone">
                    <span>Drop ingredients here! 🍲</span>
                </div>
            </section>

            <section class="filter-group">
                <h3>2. Refine Search</h3>
                <select id="diet-filter" class="mb-10">
                    <option value="">Any Diet</option>
                    <option value="vegetarian">Vegetarian</option>
                    <option value="vegan">Vegan</option>
                    <option value="ketogenic">Keto</option>
                </select>
                <!-- Inside the filter-group section in index.html -->
            <select id="cuisine-filter" class="mb-10">
                <option value="">🌍 Any Country/Region</option>
                <option value="African">African (Ethiopian, Nigerian, etc.)</option>
                <option value="Asian">Asian</option>
                <option value="Italian">Italian</option>
                <option value="Mexican">Mexican</option>
                <option value="Middle Eastern">Middle Eastern</option>
                <option value="Indian">Indian</option>
            </select>
                            <div class="macro-toggles">
                    <label class="macro-label"><input type="checkbox" id="macro-protein"> 💪 High Protein</label>
                    <label class="macro-label"><input type="checkbox" id="macro-calories"> 📉 Low Calorie</label>
                </div>

                <button id="search-btn" class="action-btn w-100 mt-10">Find Meals</button>
            </section>
        </aside>

        <section class="display-area">
            <div id="recipe-results" class="recipe-board">
                <div class="empty-state">Add an ingredient and click search to start the magic! ✨</div>
            </div>
        </section>
    </main>

    <div id="recipe-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
